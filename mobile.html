        <div class="header__lang dropdown">
          <img class="header__lang-icon dropdown-toggle" src="./images/icons/uk-flag-icon.png" alt="Lang Flag Icon" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false" role="button">

            <li><a class="dropdown-item switch-spanish" id="switch-spanish">Español</a></li>
            <li><a class="dropdown-item" href="#">English</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <p class="menu-icon dropdown-toggle" id="dropdownMenuButtonMobile" data-bs-toggle="dropdown" aria-expanded="false" role="button"><i class="fa-solid fa-bars"></i></p>
    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButtonMobile">
      <li><a class="dropdown-item"  data-bs-toggle="modal" data-bs-target="#profileModal">Your Account</a></li>
      <li><a class="dropdown-item" id="switch-spanish-mobile">Español</a></li>
      <li><a class="dropdown-item" href="#">English</a></li>
    </ul>
  </header>
  <main class="main">
    <!-- Hero -->
    <div class="hero">
      <div id="carouselIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
          <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <div class="carousel-caption c-caption">
              <div class="c-caption__title no-select">
                <h1>Find your desired destination</h1>
              </div>
            </div>
            <img src="./images/puerto-madryn.webp" class="d-block w-100 c-img" alt="Puerto Madryn">
          </div>
          <div class="carousel-item">
            <div class="carousel-caption c-caption">
              <div class="c-caption__title no-select">
                <h1>Explore without limits or borders</h1>
              </div>
            </div>
            <img src="./images/nueve-julio.webp" class="d-block w-100 c-img" alt="Av Nueve de Julio">
          </div>
          <div class="carousel-item">
            <div class="carousel-caption c-caption">
              <div class="c-caption__title no-select">
                <h1>Step into nature</h1>
              </div>
            </div>
            <img src="./images/montanas.webp" class="d-block w-100 c-img" alt="Montañas">
          </div>
          <div class="carousel-item">
            <div class="carousel-caption c-caption">
              <div class="c-caption__title no-select">  
                <h1>Your next adventure begins today</h1>
              </div>
            </div>
            <img src="./images/fitz-roy.webp" class="d-block w-100 c-img" alt="Fitz Roy">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselIndicators" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselIndicators" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

  </main>

  <!-- Modal -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="profileModalLabel">Your account</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Contenido del modal -->
          <form class="form-container">
            <div class="form-group">
              <label for="exampleInputEmail1">Email address</label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="youraddress@example.com">
            </div>
            <div class="form-group">
              <label for="exampleInputPassword1">Password</label>
              <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Your Password">
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1">Remember me</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Log In</button>
          <!-- Podés agregar más botones si querés -->
        </div>
      </div>
    </div>
  </div>
