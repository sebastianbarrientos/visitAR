<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Reddit+Mono:wght@200..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/32b8e6483f.js" crossorigin="anonymous"></script>
    <title>VisitAR • ¡Todo para tu próximo viaje por Argentina!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" href="../images/favicon.png" type="image/x-icon">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <img class="header__img" src="../images/visit-argentina-logo.svg" alt="Visit Argentina Logo">
        <nav class="header__nav">
            <a class="header__link" href="">Home</a>
            <a class="header__link" href="">Destinos</a>
            <a class="header__link" href="">Actividades</a>
            <a class="header__link" href="">Planea tu viaje</a>
        </nav>
        <div class="header__options">
            <img class="header__profile" src="../images/profile-icon.png"
                alt="Profile Pic">
            <div class="header__lang">
                <img class="header__lang-icon"
                    src="../images/spain-flag-icon.png"
                    alt="Lang Flag Icon">
                <p class="header__lang-desc">ES</p>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="hero">
            <div class="hero__title">
                <h1>Encuentra tu propio destino</h1>
            </div>
            <div id="carouselIndicators" class="carousel slide">
                <div class="carousel-indicators">
                  <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                  <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                  <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                  <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
                </div>
                <div class="carousel-inner">
                  <div class="carousel-item active">
                    <img src="../images/nueve-julio.jpg" class="d-block w-100" alt="nueve-julio">
                  </div>
                  <div class="carousel-item">
                    <img src="../images/puerto-madryn.png" class="d-block w-100" alt="puerto-madryn">
                  </div>
                  <div class="carousel-item">
                    <img src="../images/montanas.jpg" class="d-block w-100" alt="montanas">
                  </div>
                  <div class="carousel-item">
                    <img src="../images/fitz-roy-road.jpg" class="d-block w-100" alt="fitz-roy-road">
                  </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselIndicators" data-bs-slide="prev">
                  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselIndicators" data-bs-slide="next">
                  <span class="carousel-control-next-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Next</span>
                </button>
              </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
